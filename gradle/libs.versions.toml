# All versions are pinned to exact releases. No ranges, no "+", no "latest".
# Compatibility notes:
# - Kotlin 2.4.21 fully supports Gradle <= 9.7.x and AGP <= 9.3.x (kotlinlang.org compatibility table).
# - AGP 9.3 needs Gradle >= 9.5.0. Wrapper: Gradle 9.7.1.
# - Compose Multiplatform 1.12.2 ships with material3 1.12.0-alpha03 and adaptive 1.3.0 (CMP changelog).
# - Compose UI 1.12.x / Lifecycle 2.11 (AndroidX) require compileSdk >= 37.

[versions]
kotlin = "2.4.21"
agp = "9.3.3"
compose-multiplatform = "1.12.2"
compose-material3 = "1.12.0-alpha03"
compose-adaptive = "1.3.0"
androidx-lifecycle = "2.11.0"
androidx-activity = "1.13.0"
# FileProvider for sharing card images. Matches the version activity-compose 1.13.0 pulls in transitively.
androidx-core = "1.18.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
kotlinx-datetime = "0.8.0"
koin = "4.2.2"
sqldelight = "2.4.1"
play-services-location = "21.4.0"
maplibre-compose = "0.20.0"
# GitLive Firebase Kotlin SDK 2.8.0 (stable). Built with Kotlin 2.2.21; bundles Firebase Android BoM 34.18.0.
# iOS links the Firebase iOS SDK 13.1.1 as a Swift Package in the Xcode project (see iosApp/iosApp.xcodeproj).
gitlive-firebase = "2.8.0"
# Google sign-in on Android (Credential Manager + Sign in with Google ID token).
androidx-credentials = "1.6.0"
google-id = "1.2.1"

android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"

[libraries]
# Compose Multiplatform (direct coordinates; the compose.* accessors are deprecated)
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-adaptive" }

# Lifecycle (JetBrains multiplatform)
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Android entry point (setContent for the Compose host activity)
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# SQLDelight
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# Google Play services (Android only): fused location, activity transitions, geofencing
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }

# MapLibre Compose (pre-1.0 API, pinned exactly). Built with Kotlin 2.4.20 / CMP 1.12.1; iOS needs 15.5+.
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre-compose" }
maplibre-compose-runtime-opengl-android = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibre-compose" }

# Firebase (GitLive, common API over the official SDKs). composeApp only; :shared stays Firebase-free.
gitlive-firebase-app = { module = "dev.gitlive:firebase-app", version.ref = "gitlive-firebase" }
gitlive-firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitlive-firebase" }
gitlive-firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitlive-firebase" }

# Google sign-in (Android only)
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "google-id" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
