# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# iOS targets cannot be built on Windows/Linux; skip them there instead of failing.
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# App version: the single source. androidApp reads it for versionName/versionCode, composeApp generates
# AppVersion.kt from it for the Profile screen, and a check fails the build when iOS MARKETING_VERSION
# (iosApp/iosApp.xcodeproj/project.pbxproj) differs from versionName. Change it here AND in the Xcode project.
roadmaxxing.versionName=0.1.0
roadmaxxing.versionCode=1
